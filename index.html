<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Todo</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#1e1e1e;--surface:#252526;--surface-hover:#2a2d2e;--surface-active:#37373d;
--border:#3e3e42;--border-light:#454545;--primary:#cccccc;--secondary:#969696;--tertiary:#858585;
--accent:#007acc;--accent-hover:#0098ff;--danger:#f44747;--success:#4ec9b0;--warning:#dcdcaa;
--radius:6px;--radius-sm:3px;--radius-lg:10px;
--transition:200ms cubic-bezier(0.2,0,0,1);
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html{font-family:'Lato',Arial,sans-serif;background:var(--bg);color:var(--primary);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
button,input,select,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input::placeholder,textarea::placeholder{color:var(--tertiary)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

.progress{height:2px;background:var(--border);overflow:hidden;flex-shrink:0}
.progress__bar{height:100%;background:var(--accent);transition:width 400ms cubic-bezier(0.2,0,0,1);border-radius:0 1px 1px 0}

.header{position:sticky;top:0;z-index:100;background:var(--surface);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);min-height:48px}
.header__title{font-weight:600;font-size:15px;letter-spacing:0.5px;color:var(--primary)}
.header__actions{display:flex;align-items:center;gap:4px}
.header__counter{font-size:11px;color:var(--tertiary);font-weight:500;padding:2px 8px;background:var(--bg);border-radius:10px}
.header__btn{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.header__btn:hover{background:var(--surface-hover)}
.header__btn:active{background:var(--surface-active);transform:scale(0.92)}
.header__btn svg{width:16px;height:16px;stroke-width:2;stroke:var(--secondary);fill:none}

.search-bar{padding:10px 16px;display:none;background:var(--bg);border-bottom:1px solid var(--border)}
.search-bar.active{display:block;animation:slideDown 200ms ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.search-bar__input{width:100%;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--primary);transition:border-color var(--transition)}
.search-bar__input:focus{border-color:var(--accent)}

.filters{display:flex;padding:8px 16px;gap:4px;background:var(--bg);border-bottom:1px solid var(--border)}
.filter-tab{padding:6px 14px;border-radius:var(--radius);font-size:12px;font-weight:500;background:transparent;border:1px solid transparent;color:var(--secondary);transition:all var(--transition)}
.filter-tab.active{background:var(--surface-active);color:var(--primary);border-color:var(--border-light)}
.filter-tab:active{transform:scale(0.95)}
.filter-tab__count{font-size:10px;opacity:0.6;margin-left:3px}

.input-area{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.input-area__row{display:flex;gap:8px;align-items:center}
.input-area__field{flex:1;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--primary);transition:all var(--transition)}
.input-area__field:focus{border-color:var(--accent);box-shadow:0 0 0 1px rgba(0,122,204,0.2)}
.input-area__options{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.input-area__select{padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--secondary);transition:all var(--transition);appearance:none;-webkit-appearance:none}
.input-area__select:focus{border-color:var(--accent)}
.input-area__date-group{display:flex;gap:4px;align-items:center}
.input-area__date-btn{padding:5px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;color:var(--secondary);transition:all var(--transition)}
.input-area__date-btn:active,.input-area__date-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.input-area__submit{width:42px;height:42px;border-radius:var(--radius);background:var(--accent);display:flex;align-items:center;justify-content:center;transition:all var(--transition);flex-shrink:0}
.input-area__submit:hover{background:var(--accent-hover)}
.input-area__submit:active{transform:scale(0.9);background:var(--accent-hover)}
.input-area__submit svg{width:18px;height:18px;stroke:white;stroke-width:2.5;fill:none}

.todo-list{flex:1;overflow-y:auto;padding:6px 0}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);transition:all var(--transition);animation:slideIn 250ms cubic-bezier(0.2,0,0,1);position:relative;user-select:none;-webkit-user-select:none}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.todo-item:hover{background:var(--surface)}
.todo-item.deleting{animation:slideOut 250ms cubic-bezier(0.4,0,1,1) forwards;pointer-events:none}
@keyframes slideOut{to{opacity:0;transform:translateX(60px);max-height:0;padding-top:0;padding-bottom:0;margin:0;overflow:hidden;border:none}}
.todo-item.expanded{background:var(--surface)}

.todo-item__check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tertiary);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all var(--transition);cursor:pointer;margin-top:1px}
.todo-item__check:hover{border-color:var(--accent);transform:scale(1.1)}
.todo-item__check:active{transform:scale(0.9)}
.todo-item.completed .todo-item__check{background:var(--success);border-color:var(--success);animation:checkPop 300ms cubic-bezier(0.2,0,0,1)}
@keyframes checkPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.todo-item.completed .todo-item__check::after{content:'';width:5px;height:10px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

.todo-item__content{flex:1;min-width:0}
.todo-item__text{font-size:14px;line-height:1.5;word-break:break-word;cursor:text;transition:color var(--transition)}
.todo-item.completed .todo-item__text{text-decoration:line-through;color:var(--tertiary)}
.todo-item__text[contenteditable="true"]{outline:none;background:var(--surface);padding:3px 8px;border-radius:var(--radius-sm);border:1px solid var(--accent)}
.todo-item__text-highlight{background:rgba(0,122,204,0.3);border-radius:2px;padding:0 1px}
.todo-item__meta{display:flex;gap:6px;margin-top:5px;align-items:center;flex-wrap:wrap}
.todo-item__tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:0.3px}
.todo-item__tag--work{background:rgba(86,156,214,0.15);color:#569cd6}
.todo-item__tag--personal{background:rgba(78,201,176,0.15);color:#4ec9b0}
.todo-item__tag--urgent{background:rgba(244,71,71,0.15);color:#f44747}
.todo-item__tag--shopping{background:rgba(220,220,170,0.15);color:#dcdcaa}
.todo-item__date{font-size:11px;color:var(--tertiary);font-weight:400}
.todo-item__date.overdue{color:var(--danger);font-weight:600}
.todo-item__date.today{color:var(--warning);font-weight:600}
.todo-item__timestamp{font-size:10px;color:var(--tertiary);opacity:0.6}

.todo-item__priority{width:3px;position:absolute;left:0;top:4px;bottom:4px;border-radius:0 2px 2px 0}
.todo-item__priority--high{background:var(--danger)}
.todo-item__priority--medium{background:var(--warning)}
.todo-item__priority--low{background:var(--success)}

.todo-item__actions{display:flex;gap:2px;opacity:0;transform:translateX(4px);transition:all var(--transition)}
.todo-item:hover .todo-item__actions{opacity:1;transform:translateX(0)}
.todo-item__action{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.todo-item__action:hover{background:var(--surface-active);transform:scale(1.05)}
.todo-item__action:active{transform:scale(0.9)}
.todo-item__action svg{width:15px;height:15px;stroke-width:2;stroke:var(--secondary);fill:none;transition:stroke var(--transition)}
.todo-item__action--delete:hover{background:rgba(244,71,71,0.12)}
.todo-item__action--delete:hover svg{stroke:var(--danger)}
.todo-item__action--edit:hover{background:rgba(0,122,204,0.12)}
.todo-item__action--edit:hover svg{stroke:var(--accent)}
.todo-item__action--duplicate:hover{background:rgba(78,201,176,0.12)}
.todo-item__action--duplicate:hover svg{stroke:var(--success)}
.todo-item__action--expand:hover{background:rgba(220,220,170,0.12)}
.todo-item__action--expand:hover svg{stroke:var(--warning)}

.todo-item__subtasks{margin-top:8px;display:block}
.subtask{display:flex;align-items:center;gap:8px;padding:5px 0;transition:all var(--transition)}
.subtask__check{width:16px;height:16px;border-radius:var(--radius-sm);border:1.5px solid var(--tertiary);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.subtask__check:hover{border-color:var(--accent);transform:scale(1.1)}
.subtask.completed .subtask__check{background:var(--success);border-color:var(--success)}
.subtask.completed .subtask__check::after{content:'';width:3px;height:7px;border:solid white;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-0.5px,-0.5px)}
.subtask__text{flex:1;font-size:12px;color:var(--secondary);cursor:text}
.subtask.completed .subtask__text{text-decoration:line-through;color:var(--tertiary)}
.subtask__text[contenteditable="true"]{outline:none;background:var(--surface);padding:2px 6px;border-radius:var(--radius-sm);border:1px solid var(--accent)}
.subtask__delete{width:20px;height:20px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--tertiary);font-size:14px;opacity:0;transition:all var(--transition)}
.subtask:hover .subtask__delete{opacity:1}
.subtask__delete:hover{background:rgba(244,71,71,0.15);color:var(--danger)}
.subtask__add{display:flex;gap:6px;margin-top:6px;align-items:center}
.subtask__add-input{flex:1;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--primary);transition:border-color var(--transition)}
.subtask__add-input:focus{border-color:var(--accent)}
.subtask__add-input::placeholder{color:var(--tertiary)}
.subtask__add-btn{padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;color:var(--secondary);transition:all var(--transition)}
.subtask__add-btn:hover{border-color:var(--accent);color:var(--accent)}
.subtask__delete svg{width:14px;height:14px;stroke:var(--tertiary);stroke-width:2;fill:none}

.todo-item__notes{margin-top:8px;font-size:12px;color:var(--secondary);line-height:1.5;word-break:break-word;display:none;border-left:2px solid var(--border);padding-left:10px;white-space:pre-wrap}
.todo-item.expanded .todo-item__notes{display:block}
.todo-item__notes[contenteditable="true"]{outline:none;background:var(--surface);padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--accent);border-left:2px solid var(--accent);display:block}
.todo-item__notes:empty::before{content:'Add notes...';color:var(--tertiary);font-style:italic;font-size:11px}
.todo-item__notes.editing::before{content:''}

.completed-section{margin-top:8px}
.completed-section__header{display:flex;align-items:center;gap:6px;padding:8px 16px;cursor:pointer;transition:background var(--transition);border-bottom:1px solid var(--border)}
.completed-section__header:hover{background:var(--surface)}
.completed-section__chevron{width:16px;height:16px;stroke:var(--tertiary);fill:none;stroke-width:2;transition:transform var(--transition)}
.completed-section.expanded .completed-section__chevron{transform:rotate(90deg)}
.completed-section__title{font-size:12px;color:var(--tertiary);font-weight:500}
.completed-section__count{font-size:11px;color:var(--tertiary);opacity:0.6}
.completed-section__items{display:none}
.completed-section.expanded .completed-section__items{display:block}

.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px}
.empty-state.visible{display:flex}
.empty-state__icon{width:56px;height:56px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--tertiary)}
.empty-state__icon svg{width:24px;height:24px;stroke-width:1.5;fill:none}
.empty-state__text{font-size:15px;color:var(--secondary);text-align:center;font-weight:400}
.empty-state__hint{font-size:12px;color:var(--tertiary);text-align:center;margin-top:8px}

.toast{position:fixed;bottom:calc(20px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);padding:11px 18px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all 300ms cubic-bezier(0.2,0,0,1);z-index:300;white-space:nowrap;color:var(--primary);display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.toast.active{opacity:1;transform:translateX(-50%) translateY(0)}
.toast__action{background:var(--accent);color:white;border:none;padding:4px 12px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.toast__action:hover{background:var(--accent-hover)}
.toast__action:active{transform:scale(0.95)}

.context-menu{position:fixed;z-index:250;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px;min-width:180px;box-shadow:0 12px 32px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transform:scale(0.92);transition:all 150ms cubic-bezier(0.2,0,0,1)}
.context-menu.active{opacity:1;pointer-events:auto;transform:scale(1)}
.context-menu__item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;color:var(--primary);text-align:left;transition:all var(--transition)}
.context-menu__item:hover{background:var(--surface-hover)}
.context-menu__item:active{background:var(--surface-active)}
.context-menu__item svg{width:16px;height:16px;stroke-width:2;stroke:var(--secondary);fill:none;flex-shrink:0}
.context-menu__item.danger{color:var(--danger)}
.context-menu__item.danger svg{stroke:var(--danger)}
.context-menu__divider{height:1px;background:var(--border);margin:4px 8px}

.command-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:400;opacity:0;pointer-events:none;transition:opacity var(--transition);display:flex;justify-content:center;padding-top:15vh}
.command-overlay.active{opacity:1;pointer-events:auto}
.command-palette{width:100%;max-width:480px;max-height:60vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transform:translateY(-10px);transition:transform var(--transition)}
.command-overlay.active .command-palette{transform:translateY(0)}
.command-palette__input{padding:12px 16px;background:var(--bg);border:none;border-bottom:1px solid var(--border);font-size:14px;color:var(--primary);outline:none;width:100%}
.command-palette__list{overflow-y:auto;max-height:calc(60vh - 49px)}
.command-palette__item{padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--primary);cursor:pointer;transition:background var(--transition);border-bottom:1px solid var(--border)}
.command-palette__item:hover,.command-palette__item.selected{background:var(--surface-hover)}
.command-palette__item svg{width:16px;height:16px;stroke:var(--tertiary);stroke-width:2;fill:none;flex-shrink:0}
.command-palette__shortcut{margin-left:auto;font-size:11px;color:var(--tertiary);font-family:monospace}

.celebration{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;pointer-events:none}
.celebration.active{display:flex}
.celebration__text{font-size:24px;font-weight:300;color:var(--success);animation:celebPop 800ms cubic-bezier(0.2,0,0,1)}
@keyframes celebPop{0%{opacity:0;transform:scale(0.7)}30%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.15)}}

@media(min-width:481px){body{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
@media(max-width:768px){.todo-item__actions{opacity:1;transform:translateX(0)}.todo-item__action{width:36px;height:36px}}
</style>
</head>
<body>

<div class="progress"><div class="progress__bar" id="progressBar" style="width:0%"></div></div>

<header class="header">
<div class="header__title">Tasks</div>
<div class="header__actions">
<div class="header__counter" id="counter">0 active</div>
<button class="header__btn" id="searchBtn" aria-label="Search"><i data-lucide="search"></i></button>
<button class="header__btn" id="clearCompletedBtn" aria-label="Clear completed"><i data-lucide="square-check"></i></button>
<button class="header__btn" id="moreBtn" aria-label="More"><i data-lucide="more-vertical"></i></button>
</div>
</header>

<div class="search-bar" id="searchBar"><input type="text" class="search-bar__input" id="searchInput" placeholder="Search tasks..."></div>

<div class="filters" id="filterTabs">
<button class="filter-tab active" data-filter="all">All <span class="filter-tab__count" id="countAll">0</span></button>
<button class="filter-tab" data-filter="active">Active <span class="filter-tab__count" id="countActive">0</span></button>
<button class="filter-tab" data-filter="completed">Done <span class="filter-tab__count" id="countDone">0</span></button>
</div>

<div class="input-area">
<div class="input-area__row">
<input type="text" class="input-area__field" id="todoInput" placeholder="What needs to be done?" maxlength="200" autocomplete="off">
<button class="input-area__submit" id="addBtn" aria-label="Add todo"><i data-lucide="plus"></i></button>
</div>
<div class="input-area__options">
<select class="input-area__select" id="categorySelect"><option value="work">Work</option><option value="personal">Personal</option><option value="urgent">Urgent</option><option value="shopping">Shopping</option></select>
<select class="input-area__select" id="prioritySelect"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select>
<div class="input-area__date-group">
<button class="input-area__date-btn" data-days="0">Today</button>
<button class="input-area__date-btn" data-days="1">Tomorrow</button>
<button class="input-area__date-btn" data-days="7">+7d</button>
</div>
</div>
</div>

<div class="todo-list" id="todoList"></div>

<div class="completed-section" id="completedSection" style="display:none">
<div class="completed-section__header" id="completedHeader">
<i data-lucide="chevron-right" class="completed-section__chevron"></i>
<span class="completed-section__title">Completed</span>
<span class="completed-section__count" id="completedCount">0</span>
</div>
<div class="completed-section__items" id="completedItems"></div>
</div>

<div class="empty-state" id="emptyState">
<div class="empty-state__icon"><i data-lucide="clipboard-list"></i></div>
<div class="empty-state__text">No tasks yet</div>
<div class="empty-state__hint">Type above and press Enter to add</div>
</div>

<div class="toast" id="toast"></div>

<div class="context-menu" id="contextMenu">
<button class="context-menu__item" data-action="toggle"><i data-lucide="check"></i>Complete</button>
<button class="context-menu__item" data-action="edit"><i data-lucide="pencil"></i>Edit</button>
<button class="context-menu__item" data-action="duplicate"><i data-lucide="copy"></i>Duplicate</button>
<div class="context-menu__divider"></div>
<button class="context-menu__item danger" data-action="delete"><i data-lucide="trash-2"></i>Delete</button>
</div>

<div class="command-overlay" id="commandOverlay">
<div class="command-palette">
<input type="text" class="command-palette__input" id="commandInput" placeholder="Type a command...">
<div class="command-palette__list" id="commandList"></div>
</div>
</div>

<div class="celebration" id="celebration"><div class="celebration__text">All done!</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
