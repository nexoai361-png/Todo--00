<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Todo</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#000000;
--surface:#121212;
--surface-elevated:#1E1E1E;
--surface-hover:#2A2A2A;
--primary:#FFFFFF;
--secondary:#B0B0B0;
--tertiary:#666666;
--accent:#4285F4;
--accent-hover:#5A9BF6;
--danger:#FF4444;
--success:#4CAF50;
--warning:#FF9800;
--border:#2C2C2C;
--radius:8px;
--radius-lg:12px;
--radius-xl:16px;
--transition:200ms cubic-bezier(0.4,0,0.2,1);
}
html{font-family:'Lato',sans-serif;background:var(--bg);color:var(--primary);min-height:100vh;overflow-x:hidden}
body{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
button,input,textarea{font-family:inherit;border:none;outline:none;background:none;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input::placeholder{color:var(--tertiary)}
::-webkit-scrollbar{display:none}

/* Top App Bar */
.app-bar{
position:sticky;top:0;z-index:100;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
padding:16px 20px;
display:flex;align-items:center;justify-content:space-between;
border-bottom:1px solid var(--border);
}
.app-bar__title{font-weight:700;font-size:20px;letter-spacing:-0.3px}
.app-bar__actions{display:flex;gap:8px}
.app-bar__btn{
width:40px;height:40px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
transition:background var(--transition);
}
.app-bar__btn:hover,.app-bar__btn:active{background:var(--surface-elevated)}
.app-bar__btn svg{width:20px;height:20px;stroke-width:2}

/* Search */
.search-bar{padding:12px 20px;display:none}
.search-bar.active{display:block}
.search-bar__input{
width:100%;padding:12px 16px;
background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius-lg);color:var(--primary);
font-size:15px;transition:border-color var(--transition);
}
.search-bar__input:focus{border-color:var(--accent)}

/* Stats Bar */
.stats-bar{
display:flex;padding:16px 20px;gap:12px;
}
.stat-card{
flex:1;background:var(--surface);border-radius:var(--radius-lg);
padding:14px 16px;border:1px solid var(--border);
}
.stat-card__value{font-weight:700;font-size:22px;line-height:1}
.stat-card__label{font-size:12px;color:var(--secondary);margin-top:4px;font-weight:500}

/* Filter Tabs */
.filter-tabs{
display:flex;padding:0 20px 12px;gap:8px;
overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{
padding:8px 16px;border-radius:20px;
font-size:13px;font-weight:500;white-space:nowrap;
background:var(--surface);border:1px solid var(--border);
transition:all var(--transition);
}
.filter-tab.active{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.filter-tab:active{transform:scale(0.96)}

/* Input Area */
.input-area{
padding:12px 20px;
}
.input-area__row{
display:flex;gap:8px;align-items:center;
}
.input-area__field{
flex:1;padding:14px 16px;
background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius-lg);font-size:15px;
transition:border-color var(--transition);
}
.input-area__field:focus{border-color:var(--accent)}
.input-area__submit{
width:48px;height:48px;border-radius:50%;
background:var(--accent);display:flex;align-items:center;justify-content:center;
transition:all var(--transition);flex-shrink:0;
}
.input-area__submit:hover,.input-area__submit:active{background:var(--accent-hover);transform:scale(0.94)}
.input-area__submit svg{width:20px;height:20px}

/* Options Row */
.options-row{
display:flex;gap:8px;padding:0 20px 12px;align-items:center;flex-wrap:wrap;
}
.option-chip{
display:flex;align-items:center;gap:6px;
padding:6px 12px;border-radius:16px;
background:var(--surface);border:1px solid var(--border);
font-size:12px;font-weight:500;color:var(--secondary);
transition:all var(--transition);
}
.option-chip:hover{border-color:var(--tertiary)}
.option-chip__dot{width:8px;height:8px;border-radius:50%}
.option-chip__dot--work{background:#4285F4}
.option-chip__dot--personal{background:#4CAF50}
.option-chip__dot--urgent{background:#FF4444}
.option-chip__dot--shopping{background:#FF9800}
.option-chip__calendar{font-size:11px;color:var(--secondary)}

/* Todo List */
.todo-list{flex:1;padding:0 20px 100px;overflow-y:auto}
.todo-section{margin-bottom:20px}
.todo-section__header{
font-size:12px;font-weight:700;text-transform:uppercase;
letter-spacing:0.5px;color:var(--tertiary);
padding:8px 0;display:flex;align-items:center;gap:8px;
}
.todo-section__count{
background:var(--surface);padding:2px 8px;border-radius:10px;
font-size:11px;font-weight:600;
}
.todo-item{
background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius-lg);padding:14px 16px;
margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;
transition:all var(--transition);animation:slideIn 300ms ease;
position:relative;overflow:hidden;
}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.todo-item:hover{border-color:var(--tertiary)}
.todo-item.completed{opacity:0.5}
.todo-item.completed .todo-item__text{text-decoration:line-through;color:var(--secondary)}
.todo-item.deleting{animation:slideOut 300ms ease forwards}
@keyframes slideOut{to{opacity:0;transform:translateX(100%);margin-bottom:-60px}}

.todo-item__check{
width:22px;height:22px;border-radius:50%;
border:2px solid var(--tertiary);flex-shrink:0;
display:flex;align-items:center;justify-content:center;
transition:all var(--transition);margin-top:1px;
}
.todo-item__check:hover{border-color:var(--accent)}
.todo-item.completed .todo-item__check{background:var(--success);border-color:var(--success)}
.todo-item.completed .todo-item__check::after{
content:'';width:6px;height:11px;
border:solid white;border-width:0 2px 2px 0;
transform:rotate(45deg) translate(-1px,-1px);
}
.todo-item__content{flex:1;min-width:0}
.todo-item__text{font-size:15px;font-weight:400;line-height:1.4;word-break:break-word}
.todo-item__meta{display:flex;gap:8px;margin-top:6px;align-items:center;flex-wrap:wrap}
.todo-item__tag{
font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;
text-transform:uppercase;letter-spacing:0.3px;
}
.todo-item__tag--work{background:rgba(66,133,244,0.15);color:#5A9BF6}
.todo-item__tag--personal{background:rgba(76,175,80,0.15);color:#66BB6A}
.todo-item__tag--urgent{background:rgba(255,68,68,0.15);color:#FF6B6B}
.todo-item__tag--shopping{background:rgba(255,152,0,0.15);color:#FFB74D}
.todo-item__date{font-size:11px;color:var(--tertiary);font-weight:500}
.todo-item__priority{width:3px;position:absolute;left:0;top:0;bottom:0;border-radius:0}
.todo-item__priority--high{background:var(--danger)}
.todo-item__priority--medium{background:var(--warning)}
.todo-item__priority--low{background:var(--success)}
.todo-item__actions{display:flex;gap:4px;opacity:0;transition:opacity var(--transition)}
.todo-item:hover .todo-item__actions{opacity:1}
.todo-item__action{
width:34px;height:34px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
transition:all var(--transition);
}
.todo-item__action:hover{background:var(--surface-elevated)}
.todo-item__action svg{width:16px;height:16px;stroke-width:2}
.todo-item__action--delete:hover{color:var(--danger)}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.empty-state__icon{width:64px;height:64px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.empty-state__icon svg{width:28px;height:28px;color:var(--tertiary)}
.empty-state__title{font-size:17px;font-weight:600;margin-bottom:6px}
.empty-state__text{font-size:14px;color:var(--secondary);line-height:1.5}

/* FAB */
.fab{
position:fixed;bottom:24px;right:24px;
width:56px;height:56px;border-radius:var(--radius-xl);
background:var(--accent);display:flex;align-items:center;justify-content:center;
box-shadow:0 8px 24px rgba(66,133,244,0.3);
transition:all var(--transition);z-index:90;
}
.fab:hover{background:var(--accent-hover);transform:scale(1.05)}
.fab:active{transform:scale(0.95)}
.fab svg{width:24px;height:24px}

/* Bottom Sheet */
.sheet-overlay{
position:fixed;inset:0;background:rgba(0,0,0,0.6);
z-index:200;opacity:0;pointer-events:none;
transition:opacity var(--transition);
}
.sheet-overlay.active{opacity:1;pointer-events:auto}
.sheet{
position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
width:100%;max-width:480px;
background:var(--surface-elevated);border-radius:20px 20px 0 0;
z-index:201;padding:24px 20px 40px;
transition:transform var(--transition);
}
.sheet.active{transform:translateX(-50%) translateY(0)}
.sheet__handle{width:36px;height:4px;background:var(--tertiary);border-radius:2px;margin:0 auto 20px}
.sheet__title{font-size:18px;font-weight:700;margin-bottom:20px}
.sheet__field{margin-bottom:16px}
.sheet__label{font-size:13px;font-weight:600;color:var(--secondary);margin-bottom:6px;display:block}
.sheet__input,.sheet__select{
width:100%;padding:12px 14px;
background:var(--surface);border:1px solid var(--border);
border-radius:var(--radius);font-size:15px;color:var(--primary);
transition:border-color var(--transition);
}
.sheet__input:focus,.sheet__select:focus{border-color:var(--accent)}
.sheet__select{appearance:none;-webkit-appearance:none}
.sheet__row{display:flex;gap:8px;margin-bottom:16px}
.sheet__row .sheet__field{flex:1;margin-bottom:0}
.sheet__actions{display:flex;gap:8px;margin-top:24px}
.sheet__btn{
flex:1;padding:14px;border-radius:var(--radius-lg);
font-size:15px;font-weight:600;
transition:all var(--transition);
}
.sheet__btn--primary{background:var(--accent);color:white}
.sheet__btn--primary:hover{background:var(--accent-hover)}
.sheet__btn--secondary{background:var(--surface);color:var(--primary);border:1px solid var(--border)}
.sheet__btn--secondary:hover{background:var(--surface-hover)}
.sheet__btn:active{transform:scale(0.97)}

/* Toast */
.toast{
position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
background:var(--surface-elevated);border:1px solid var(--border);
padding:12px 20px;border-radius:var(--radius-lg);
font-size:14px;font-weight:500;
opacity:0;pointer-events:none;transition:all var(--transition);
z-index:300;white-space:nowrap;
}
.toast.active{opacity:1;transform:translateX(-50%) translateY(0)}
.toast--error{border-color:var(--danger)}
.toast--success{border-color:var(--success)}

/* Ripple */
.ripple{position:relative;overflow:hidden}
.ripple::after{
content:'';position:absolute;inset:0;
background:radial-gradient(circle,rgba(255,255,255,0.15) 10%,transparent 10%);
background-size:1000% 1000%;background-position:center;
transition:background-size 0.4s ease,opacity 0.4s ease;opacity:0;
}
.ripple:active::after{background-size:0 0;opacity:1;transition:0s}

/* Priority Select */
.priority-select{display:flex;gap:8px}
.priority-option{
flex:1;padding:10px;border-radius:var(--radius);
border:1px solid var(--border);text-align:center;
font-size:13px;font-weight:500;cursor:pointer;
transition:all var(--transition);
}
.priority-option:hover{border-color:var(--tertiary)}
.priority-option.active{border-color:var(--accent);background:rgba(66,133,244,0.1);color:var(--accent)}

/* Category Select */
.category-select{display:flex;gap;gap:8px;flex-wrap:wrap}
.category-option{
padding:8px 14px;border-radius:20px;
border:1px solid var(--border);font-size:13px;font-weight:500;
transition:all var(--transition);
}
.category-option.active{border-color:var(--accent);background:rgba(66,133,244,0.1);color:var(--accent)}

@media(min-width:481px){
body{border-left:1px solid var(--border);border-right:1px solid var(--border)}
.sheet{left:50%;transform:translateX(-50%) translateY(100%)}
.sheet.active{transform:translateX(-50%) translateY(0)}
}
</style>
</head>
<body>

<!-- App Bar -->
<header class="app-bar">
<div class="app-bar__title">Tasks</div>
<div class="app-bar__actions">
<button class="app-bar__btn ripple" id="searchBtn" aria-label="Search">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
</button>
<button class="app-bar__btn ripple" id="clearCompletedBtn" aria-label="Clear completed">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
</button>
</div>
</header>

<!-- Search -->
<div class="search-bar" id="searchBar">
<input type="text" class="search-bar__input" id="searchInput" placeholder="Search tasks...">
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
<div class="stat-card">
<div class="stat-card__value" id="statTotal">0</div>
<div class="stat-card__label">Total</div>
</div>
<div class="stat-card">
<div class="stat-card__value" id="statActive">0</div>
<div class="stat-card__label">Active</div>
</div>
<div class="stat-card">
<div class="stat-card__value" id="statDone">0</div>
<div class="stat-card__label">Done</div>
</div>
</div>

<!-- Filters -->
<div class="filter-tabs" id="filterTabs">
<button class="filter-tab active" data-filter="all">All</button>
<button class="filter-tab" data-filter="active">Active</button>
<button class="filter-tab" data-filter="completed">Done</button>
<button class="filter-tab" data-filter="today">Today</button>
</div>

<!-- Quick Options -->
<div class="options-row" id="quickOptions">
<button class="option-chip ripple" data-category="work">
<span class="option-chip__dot option-chip__dot--work"></span>Work
</button>
<button class="option-chip ripple" data-category="personal">
<span class="option-chip__dot option-chip__dot--personal"></span>Personal
</button>
<button class="option-chip ripple" data-category="urgent">
<span class="option-chip__dot option-chip__dot--urgent"></span>Urgent
</button>
<button class="option-chip ripple" data-category="shopping">
<span class="option-chip__dot option-chip__dot--shopping"></span>Shopping
</button>
</div>

<!-- Quick Add -->
<div class="input-area">
<div class="input-area__row">
<input type="text" class="input-area__field" id="quickInput" placeholder="Add a task..." maxlength="200">
<button class="input-area__submit ripple" id="quickAddBtn" aria-label="Add task">
<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</div>

<!-- Todo List -->
<div class="todo-list" id="todoList"></div>

<!-- Empty State -->
<div class="empty-state" id="emptyState" style="display:none">
<div class="empty-state__icon">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
</div>
<div class="empty-state__title">No tasks yet</div>
<div class="empty-state__text">Tap + to add your first task and get organized.</div>
</div>

<!-- FAB -->
<button class="fab ripple" id="fabBtn" aria-label="Add new task">
<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
<div class="sheet__handle"></div>
<div class="sheet__title">New Task</div>
<div class="sheet__field">
<label class="sheet__label">Task Name</label>
<input type="text" class="sheet__input" id="taskName" placeholder="What needs to be done?" maxlength="200">
</div>
<div class="sheet__row">
<div class="sheet__field">
<label class="sheet__label">Category</label>
<div class="category-select" id="categorySelect">
<button class="category-option active" data-value="work">Work</button>
<button class="category-option" data-value="personal">Personal</button>
<button class="category-option" data-value="urgent">Urgent</button>
<button class="category-option" data-value="shopping">Shopping</button>
</div>
</div>
<div class="sheet__field">
<label class="sheet__label">Priority</label>
<div class="priority-select" id="prioritySelect">
<div class="priority-option active" data-value="low">Low</div>
<div class="priority-option" data-value="medium">Med</div>
<div class="priority-option" data-value="high">High</div>
</div>
</div>
</div>
<div class="sheet__field">
<label class="sheet__label">Due Date</label>
<input type="date" class="sheet__input" id="taskDate">
</div>
<div class="sheet__actions">
<button class="sheet__btn sheet__btn--secondary ripple" id="cancelBtn">Cancel</button>
<button class="sheet__btn sheet__btn--primary ripple" id="saveBtn">Save Task</button>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
const STORAGE_KEY='todo_app_v1';
let todos=[];
let currentFilter='all';
let searchQuery='';
let editingId=null;
let quickCategory='work';

function loadTodos(){
try{
const data=localStorage.getItem(STORAGE_KEY);
if(data)todos=JSON.parse(data);
}catch(e){todos=[]}
}
function saveTodos(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(todos));
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Date().toISOString().split('T')[0]}
function formatDate(d){
if(!d)return '';
const date=new Date(d);
const now=new Date();
const diff=Math.floor((date-now)/(1000*60*60*24));
if(diff===0)return 'Today';
if(diff===1)return 'Tomorrow';
if(diff===-1)return 'Yesterday';
return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function isToday(d){return d===today()}
function isOverdue(d){if(!d)return false;return new Date(d)<new Date(today())}

function showToast(msg,type=''){
const t=document.getElementById('toast');
t.textContent=msg;
t.className='toast active '+type;
setTimeout(()=>t.className='toast '+type,2200);
}

function getFiltered(){
let list=[...todos];
if(searchQuery){
const q=searchQuery.toLowerCase();
list=list.filter(t=>t.text.toLowerCase().includes(q));
}
switch(currentFilter){
case 'active':list=list.filter(t=>!t.completed);break;
case 'completed':list=list.filter(t=>t.completed);break;
case 'today':list=list.filter(t=>isToday(t.date));break;
}
return list.sort((a,b)=>{
if(a.completed!==b.completed)return a.completed?1:-1;
const p={high:0,medium:1,low:2};
if(a.priority!==b.priority)return p[a.priority]-p[b.priority];
return b.createdAt-a.createdAt;
});
}

function render(){
const list=getFiltered();
const container=document.getElementById('todoList');
const empty=document.getElementById('emptyState');
const statsBar=document.getElementById('statsBar');

document.getElementById('statTotal').textContent=todos.length;
document.getElementById('statActive').textContent=todos.filter(t=>!t.completed).length;
document.getElementById('statDone').textContent=todos.filter(t=>t.completed).length;

if(todos.length===0){
container.innerHTML='';
empty.style.display='flex';
statsBar.style.display='none';
return;
}
empty.style.display='none';
statsBar.style.display='flex';

const grouped={};
list.forEach(t=>{
const key=t.completed?'Completed':isOverdue(t.date)&&!t.completed?'Overdue':isToday(t.date)?'Today':'Upcoming';
if(!grouped[key])grouped[key]=[];
grouped[key].push(t);
});

const sectionOrder=['Overdue','Today','Upcoming','Completed'];
container.innerHTML='';
sectionOrder.forEach(section=>{
if(!grouped[grouped])return;
const items=grouped[section];
if(!items||!items.length)return;
const div=document.createElement('div');
div.className='todo-section';
div.innerHTML=`<div class="todo-section__header">${section}<span class="section-count">${items.length}</span></div>`;
items.forEach(t=>div.appendChild(createTodoEl(t)));
container.appendChild(div);
});
}

function createTodoEl(t){
const el=document.createElement('div');
el.className='todo-item'+(t.completed?' completed':'');
el.dataset.id=t.id;

const priorityClass=t.priority!=='low'?`todo-item__priority todo-item__priority--${t.priority}`:'';
const dateStr=formatDate(t.date);
const dateClass=isOverdue(t.date)&&!t.completed?' style="color:var(--danger)"':'';

el.innerHTML=`
<div class="todo-item__priority ${priorityClass}"></div>
<button class="todo-item__check ripple" data-action="toggle" aria-label="Toggle complete"></button>
<div class="todo-item__content">
<div class="todo-item__text">${esc(t.text)}</div>
<div class="todo-item__meta">
<span class="todo-item__tag todo-item__tag--${t.category}">${t.category}</span>
${dateStr?`<span class="todo-item__date"${dateClass}>${dateStr}</span>`:''}
</div>
</div>
<div class="todo-item__actions">
<button class="todo-item__action ripple" data-action="edit" aria-label="Edit">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
</button>
<button class="todo-item__action todo-item__action--delete ripple" data-action="delete" aria-label="Delete">

return el;
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function addTodo(text,category,priority,date){
if(!text.trim())return;
todos.push({id:uid(),text:text.trim(),category,priority,date:date||'',completed:false,createdAt:Date.now()});
saveTodos();
render();
showToast('Task added','success');
}

function toggleTodo(id){
const t=todos.find(t=>t.id===id);
if(t){t.completed=!t.completed;saveTodos();render();}
}
function deleteTodo(id){
const el=document.querySelector(`[data-id="${id}"]`);
if(el){el.classList.add('deleting');setTimeout(()=>{todos=todos.filter(t=>t.id!==id);saveTodos();render();showToast('Task deleted');},300)}
}
function editTodo(id){
const t=todos.find(t=>t.id===id);
if(!t)return;
editingId=id;
document.getElementById('taskName').value=t.text;
document.querySelectorAll('.category-option').forEach(b=>b.classList.toggle('active',b.dataset.value===t.category));
document.querySelectorAll('.priority-option').forEach(b=>b.classList.toggle('active',b.dataset.value===t.priority));
document.getElementById('taskDate').value=t.date||'';
openSheet();
}
function updateTodo(){
if(!editingId)return;
const t=todos.find(t=>t.id===editingId);
if(!t)return;
const text=document.getElementById('taskName').value.trim();
if(!text){showToast('Task cannot be empty','error');return;}
t.text=text;
t.category=document.querySelector('.category-option.active')?.dataset.value||'work';
t.priority=document.querySelector('.priority-option.active')?.dataset.value||'low';
t.date=document.getElementById('taskDate').value;
editingId=null;
saveTodos();
render();
closeSheet();
showToast('Task updated','success');
}

function openSheet(){document.getElementById('sheetOverlay').classList.add('active');document.getElementById('sheet').classList.add('active');document.getElementById('taskName').focus()}
function closeSheet(){
document.getElementById('sheetOverlay').classList.remove('active');
document.getElementById('sheet').classList.remove('active');
editingId=null;
document.getElementById('taskName').value='';
document.getElementById('taskDate').value='';
document.querySelectorAll('.category-option').forEach((b,i)=>b.classList.toggle('active',i===0));
document.querySelectorAll('.priority-option').forEach((b,i)=>b.classList.toggle('active',i===0));
}

// Events
document.getElementById('quickAddBtn').addEventListener('click',()=>{
const input=document.getElementById('quickInput');
addTodo(input.value,'work','low','');
input.value='';
});
document.getElementById('quickInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('quickAddBtn').click()});

document.getElementById('todoList').addEventListener('click',e=>{
const btn=e.target.closest('[data-action]');
if(!btn)return;
const item=btn.closest('.todo-item');
const id=item.dataset.id;
switch(btn.dataset.action){
case'toggle':toggleTodo(id);break;
case'edit':editTodo(id);break;
case'delete':deleteTodo(id);break;
}
});

document.getElementById('fabBtn').addEventListener('click',openSheet);
document.getElementById('cancelBtn').addEventListener('click',closeSheet);
document.getElementById('saveBtn').addEventListener('click',()=>{if(editingId)updateTodo();else{
const text=document.getElementById('taskName').value;
const cat=document.querySelector('.category-option.active')?.dataset.value||'work';
const pri=document.querySelector('.priority-option.active')?.dataset.value||'low';
const date=document.getElementById('taskDate').value;
addTodo(text,cat,pri,date);
closeSheet();
}});
document.getElementById('sheetOverlay').addEventListener('click',closeSheet);

document.querySelectorAll('.priority-option').forEach(el=>{
el.addEventListener('click',()=>document.querySelectorAll('.priority-option').forEach(e=>e.classList.remove('active'),el.classList.add('active'));
});
document.querySelectorAll('.category-option').forEach(el=>{
el.addEventListener('click',()=>document.querySelectorAll('.category-option').forEach(e=>e.classList.remove('active'),el.classList.add('active'));
});

document.querySelectorAll('.filter-tab').forEach(tab=>{
tab.addEventListener('click',()=>{
document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
currentFilter=tab.dataset.filter;
render();
});
});

document.getElementById('searchBtn').addEventListener('click',()=>{
const bar=document.getElementById('searchBar');
bar.classList.toggle('active');
if(bar.classList.contains('active'))document.getElementById('searchInput').focus();
});
document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value;render()});

document.getElementById('clearCompletedBtn').addEventListener('click',()=>{
const completed=todos.filter(t=>t.completed);
if(!completed.length){showToast('No completed tasks');return;}
todos=todos.filter(t=>!t.completed);
saveTodos();
render();
showToast('Completed tasks cleared');
});

document.querySelectorAll('.option-chip').forEach(chip=>{
chip.addEventListener('click',()=>{
quickCategory=chip.dataset.category;
document.getElementById('quickInput').focus();
document.getElementById('quickInput').placeholder=`Add ${quickCategory} task...`;
});
});

document.addEventListener('keydown',e=>{
if(e.key==='Escape')closeSheet();
});

// Init
loadTodos();
render();
})();
</script>
</body>
</html>
